name: Test Packages

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-homebrew:
    runs-on: macos-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Install Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: 0.15.1
        
    - name: Test Homebrew Formulae
      run: |
        # Test each formula locally without tapping
        for formula in homebrew/Formula/*.rb; do
          if [ -f "$formula" ]; then
            package_name=$(basename "$formula" .rb)
            echo "Testing $package_name formula..."
            
            # Install from local formula file
            brew install --build-from-source --formula "$formula"
            
            # Run basic audit (skip online checks that might fail in CI)
            brew audit --strict "$formula" || echo "Audit warnings detected"
            
            # Test basic functionality
            if command -v "$package_name" &> /dev/null; then
              echo "Testing $package_name functionality..."
              "$package_name" --version && echo "✅ $package_name version check passed"
            else
              echo "⚠️ $package_name command not found in PATH"
            fi
            
            echo "✅ $package_name formula test completed"
          fi
        done

  test-scoop:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Install Scoop
      run: |
        Set-ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
        iex "& {$(irm get.scoop.sh)} -RunAsAdmin"
        
    - name: Test Scoop Manifests
      run: |
        # Test each manifest
        Get-ChildItem scoop\bucket\*.json | ForEach-Object {
          $manifestPath = $_.FullName
          $packageName = $_.BaseName
          
          Write-Host "Testing $packageName..."
          
          try {
            # Install package from local manifest
            scoop install $manifestPath
            
            # Test basic functionality
            if (Get-Command $packageName -ErrorAction SilentlyContinue) {
              & $packageName --version
            }
            
            Write-Host "✅ $packageName test passed"
          } catch {
            Write-Error "❌ $packageName test failed: $_"
            exit 1
          }
        }

  test-linux:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Install dependencies
      run: |
        # Install Homebrew on Linux
        /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
        echo "/home/linuxbrew/.linuxbrew/bin" >> $GITHUB_PATH
        
    - name: Install Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: 0.15.1
        
    - name: Test Homebrew Formulae on Linux
      run: |
        # Test each formula on Linux
        for formula in homebrew/Formula/*.rb; do
          if [ -f "$formula" ]; then
            package_name=$(basename "$formula" .rb)
            echo "Testing $package_name formula on Linux..."
            
            # Install from local formula file
            brew install --build-from-source --formula "$formula"
            
            # Test basic functionality
            if command -v "$package_name" &> /dev/null; then
              echo "Testing $package_name functionality..."
              "$package_name" --version && echo "✅ $package_name version check passed on Linux"
            else
              echo "⚠️ $package_name command not found in PATH"
            fi
            
            echo "✅ $package_name formula test completed on Linux"
          fi
        done